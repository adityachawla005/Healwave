<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | HealWave</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="inner">
  <header class="site-header solid">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/healwave-logo.png" alt="Healwave logo" />
        <span>Healwave</span>
      </a>
      <button class="menu-toggle" type="button">Menu</button>
      <nav class="nav-links">
        <a href="solutions.html">Products</a>
        <a href="company.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="research.html">Research</a>
      </nav>
      <a class="link" href="mailto:hello@healwave.life">hello@healwave.life</a>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap editorial">
        <div>
          <p class="kicker reveal">Contact</p>
          <h1 class="reveal">Tell us what you want to build.</h1>
        </div>
        <form class="reveal" action="mailto:hello@healwave.life" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" required />
          </div>
          <div>
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div>
            <label for="org">Organization</label>
            <input id="org" name="organization" />
          </div>
          <div>
            <label for="interest">Interest</label>
            <select id="interest" name="interest">
              <option>AI Diagnostics</option>
              <option>VR / AR Training</option>
              <option>VitaPulse</option>
              <option>Partnership</option>
              <option>Clinical collaboration</option>
            </select>
          </div>
          <div>
            <label for="message">Note</label>
            <textarea id="message" name="message"></textarea>
          </div>
          <button class="link" type="submit">Send the note</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap foot">
      <div><strong>Healwave Healthtech Private Limited</strong><p>MAHE spin-off · MUTBI-incubated · Manipal, Karnataka</p></div>
      <div><a href="solutions.html">Products</a><a href="research.html">Research</a></div>
      <div><a href="company.html">About</a><a href="contact.html">Contact</a></div>
      <div><a href="mailto:hello@healwave.life">hello@healwave.life</a></div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
